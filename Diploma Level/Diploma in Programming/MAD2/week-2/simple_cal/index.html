<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/mathjs@15.2.0/lib/browser/math.min.js"></script>
    
    <script type="text/javascript">
        function addLog(msg){
            var ul = document.getElementById("log");
            var li = document.createElement("li");
            var msg_text_node = document.createTextNode(msg);
            li.appendChild(msg_text_node);
            ul.appendChild(li);
        }

        function calculate(){
            expression = document.getElementById("expression").value;
            console.log(expression);
            if(expression){
                try{
                    answer = eval(expression);
                    document.getElementById("expression").value = answer;
                    addLog(expression + "=" + answer);
                }catch(e){
                    console.log("Bad expression");
                    addLog(expression + " is bad. Please fix it.");
                }
            }
        }

         function math_calculate(){
            expression = document.getElementById("expression").value;
            console.log(expression);
            if(expression){
                try{
                    answer = math.evaluate(expression);
                    document.getElementById("expression").value = answer;
                    addLog(expression + "=" + answer);
                }catch(e){
                    console.log("Bad expression");
                    addLog(expression + " is bad. Please fix it.");
                }
            }
        }

        function initalize_app(){
            calculate_button = document.getElementById("calculate");
            calculate_button.addEventListener("click", math_calculate);
        }

        function input_number(v){
            expression = document.getElementById("expression").value;
            expression = expression + v;
            document.getElementById("expression").value = expression;
        }

        function input_operator(o){
            expression = document.getElementById("expression").value;
            expression = expression + o;
            document.getElementById("expression").value = expression;
        }

    </script>
</head>
<body onload="initalize_app()">
    <div class="container">
        <div class="row">
            <div class="col">
            </div>
            <div class="col">
                <input type="input" class="form-control" id="expression" placeholder="3*5" />
            </div>
            <div class="col">
            </div>
        </div>

        <div class="row">
            <div class="col">
            </div>
            <div class="col">
                <button class="btn btn-primary" onclick="input_number('7')">&nbsp;7&nbsp;</button> 
                <button class="btn btn-primary" onclick="input_number('8')">&nbsp;8&nbsp;</button>
                <button class="btn btn-primary" onclick="input_number('9')">&nbsp;9&nbsp;</button>
                <button class="btn btn-warning" onclick="input_operator('/')">&nbsp;/&nbsp;</button>
            </div>
            <div class="col">
            </div>
        </div>

        <div class="row">
            <div class="col">
            </div>
            <div class="col">
                <button class="btn btn-primary" onclick="input_number('4')">&nbsp;4&nbsp;</button> 
                <button class="btn btn-primary" onclick="input_number('5')">&nbsp;5&nbsp;</button>
                <button class="btn btn-primary" onclick="input_number('6')">&nbsp;6&nbsp;</button>
                <button class="btn btn-warning" onclick="input_operator('x')">&nbsp;x&nbsp;</button>
            </div>
            <div class="col">
            </div>
        </div>

        <div class="row">
            <div class="col">
            </div>
            <div class="col">
                <button class="btn btn-primary" onclick="input_number('1')">&nbsp;1&nbsp;</button> 
                <button class="btn btn-primary" onclick="input_number('2')">&nbsp;2&nbsp;</button>
                <button class="btn btn-primary" onclick="input_number('3')">&nbsp;3&nbsp;</button>
                <button class="btn btn-warning" onclick="input_operator('-')">&nbsp;-&nbsp;</button>
            </div>
            <div class="col">
            </div>
        </div>

        <div class="row">
            <div class="col">
            </div>
            <div class="col">
                <button class="btn btn-primary" onclick="input_number('0')">&nbsp;0&nbsp;</button> 
                <button class="btn btn-success" id="calculate">&nbsp;=&nbsp;</button>
                <button class="btn btn-warning" onclick="input_operator('.')">&nbsp;.&nbsp;</button>
                <button class="btn btn-warning" onclick="input_operator('+')">&nbsp;+&nbsp;</button>
            </div>
            <div class="col">
            </div>
        </div>

        <div class="row">
            <div class="col">
            </div>
            <div class="col">
                <ul id="log">

                </ul>
            </div>
            <div class="col">
            </div>
        </div>
    </div>
</body>
<!-- <script>
    initalize_app()
</script> -->
</html>
